<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>夢女與夢角 · 字卡傳訊</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --text:#2b2b2b; --text-sub:#8a8a8a;
  --user-bubble:#95ec69; --user-text:#1a1a1a; --dream-bubble:#ffffff; --dream-text:#2b2b2b;
  --btn:#95ec69; --btn-text:#1a1a1a; --input-bg:#f0eee9; --input-text:#2b2b2b;
  --avatar-border:#e2ddd4; --typing-bg:#ffffff; --typing-text:#8a8a8a;
  --call-mask:rgba(0,0,0,.55); --accent:#95ec69; --divider:#e8e4dc;
  --shadow:0 8px 30px rgba(0,0,0,.08); --nav-bg:#ffffff;
  --tarot-bg:linear-gradient(160deg,#fdf6ec,#efe4d2); --tarot-card:#fffdf8;
  --tarot-accent:#b98b4e; --tarot-gold:#c9a25e; --tarot-text:#3a2f22;
  --bubble-radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input,textarea,select{font-family:inherit;touch-action:manipulation}
.hidden{display:none !important}

#app{width:100%;max-width:900px;height:90vh;height:90dvh;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}

#nav{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--divider);background:var(--nav-bg);gap:8px}
#nav .brand{font-size:16px;font-weight:700;letter-spacing:1px}
#nav .acct{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-sub);cursor:default}
#nav .dot{width:8px;height:8px;border-radius:50%;background:#37c26a}
.nav-left{display:flex;align-items:center;gap:8px;min-width:0}
.back-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--input-bg);color:var(--text);flex-shrink:0}
.back-btn svg{width:18px;height:18px}

.page{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.page.hidden{display:none}

/* 主頁 */
#homePage{padding:0}
.home-list{flex:1;overflow-y:auto;padding:10px 12px 120px;-webkit-overflow-scrolling:touch}
.home-empty{text-align:center;color:var(--text-sub);font-size:13.5px;padding:60px 20px;line-height:1.8}
.dream-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--divider);margin-bottom:8px;cursor:pointer;transition:.15s}
.dream-card:hover{background:var(--input-bg)}
.dream-card .dc-av{width:50px;height:50px;border-radius:50%;overflow:hidden;border:2px solid var(--avatar-border);background:#eee;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dream-card .dc-av img{width:100%;height:100%;object-fit:cover}
.dream-card .dc-info{flex:1;min-width:0}
.dream-card .dc-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dream-card .dc-last{font-size:12px;color:var(--text-sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 信封按钮 & 收件匣 */
.home-footer{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;background:linear-gradient(to top,var(--panel) 70%,transparent);z-index:10}
.mail-btn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--btn-text);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:.15s;flex-shrink:0}
.mail-btn:hover{filter:brightness(.95);transform:translateY(-1px)}
.mail-btn svg{width:22px;height:22px}
.inbox-btn{flex:1;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--text);transition:.15s}
.inbox-btn:hover{background:var(--input-bg)}
.inbox-btn .ib-left{display:flex;align-items:center;gap:8px}
.inbox-btn .ib-left svg{width:18px;height:18px}
.inbox-btn .ib-badge{background:var(--accent);color:var(--btn-text);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px}
.fab{position:absolute;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--btn-text);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:10;transition:.15s}
.fab:hover{filter:brightness(.95);transform:scale(1.04)}
.fab svg{width:22px;height:22px}

/* 聊天頁 */
#chatPage{padding:0}
#chatTop{flex-shrink:0;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--nav-bg);border-bottom:1px solid var(--divider);flex-wrap:nowrap}
.hero-avatar{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}
.hero-avatar .av{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--avatar-border);background:#eee;display:flex;align-items:center;justify-content:center;position:relative}
.hero-avatar .av img{width:100%;height:100%;object-fit:cover;display:block}
.hero-avatar .av .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.hero-avatar .nm{font-size:11px;color:var(--text);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ecg{width:56px;height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ecg svg{width:56px;height:46px}
.func-strip{display:flex;flex-direction:row;align-items:center;gap:5px;margin-left:6px;flex-shrink:0}
.func-btn{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--btn);color:var(--btn-text);transition:.15s;padding:0}
.func-btn:hover{filter:brightness(.92)}
.func-btn svg{width:13px;height:13px;display:block}

#msgList{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background-color:var(--bg);background-size:contain;background-repeat:no-repeat;background-position:center;-webkit-overflow-scrolling:touch}

.msg-row{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msg-row.user{flex-direction:row-reverse}
.msg-row .mav{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--avatar-border);background:#eee;display:flex;align-items:center;justify-content:center}
.msg-row .mav img{width:100%;height:100%;object-fit:cover}
.msg-body{display:flex;flex-direction:column;max-width:calc(100% - 90px);min-width:0}
.msg-row.user .msg-body{align-items:flex-end}
.msg-meta{display:flex;align-items:center;gap:6px;margin:0 4px 3px;font-size:11px;color:var(--text-sub)}
.msg-row.user .msg-meta{flex-direction:row-reverse}
.msg-name{font-size:11px;color:var(--text-sub)}
.msg-time{font-size:10px;color:var(--text-sub);opacity:.8}

.bubble{position:relative;padding:9px 13px;font-size:14.5px;line-height:1.5;word-break:break-word;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04);z-index:1}
.msg-row.user .bubble{background:var(--user-bubble);color:var(--user-text);border-radius:var(--bubble-radius)}
.msg-row.dream .bubble{background:var(--dream-bubble);color:var(--dream-text);border-radius:var(--bubble-radius)}
.msg-row.user .bubble::after{content:"";position:absolute;right:-6px;top:12px;width:12px;height:12px;background:var(--user-bubble);transform:rotate(45deg);border-radius:2px;z-index:-1;display:var(--user-tail,block)}
.msg-row.dream .bubble::after{content:"";position:absolute;left:-6px;top:12px;width:12px;height:12px;background:var(--dream-bubble);transform:rotate(45deg);border-radius:2px;z-index:-1;display:var(--dream-tail,block)}
.msg-row.dream .bubble.star-deco::before{content:"";position:absolute;top:-8px;right:-8px;width:18px;height:18px;background:var(--accent);-webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.5l7.1-.6z"/></svg>') center/contain no-repeat;mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.5l7.1-.6z"/></svg>') center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));z-index:2;display:var(--star-deco,block)}
.msg-row.user .bubble.star-deco::before{display:none}

.bubble img.chat-img{max-width:200px;max-height:260px;border-radius:10px;display:block}
.bubble .quote{font-size:12px;color:var(--text-sub);background:rgba(0,0,0,.05);border-left:3px solid var(--accent);padding:5px 8px;border-radius:6px;margin-bottom:6px;line-height:1.4}
.msg-sticker{width:80px;height:80px;object-fit:contain;display:block}
.read-mark{font-size:10px;color:var(--text-sub);margin:2px 6px 0}
.sys-center{display:flex;justify-content:center;margin:2px 0}
.sys-pill{font-size:11.5px;color:#fff;background:rgba(0,0,0,.28);padding:4px 12px;border-radius:12px}
.date-divider{display:flex;justify-content:center;margin:4px 0}
.date-divider span{font-size:11px;color:var(--text-sub);background:rgba(0,0,0,.05);padding:3px 10px;border-radius:10px}

.survey-card{border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--divider);padding:10px 12px;margin-top:2px;max-width:260px}
.survey-card .stitle{font-size:13.5px;font-weight:600;margin-bottom:8px;line-height:1.4;color:var(--text)}
.survey-card .sopt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.7);margin-bottom:5px;font-size:13px;line-height:1.4;color:var(--text)}
.survey-card .sopt:last-child{margin-bottom:0}
.survey-card .sopt .sidx{width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--btn-text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.survey-card .sopt.chosen{background:var(--accent);color:var(--btn-text);font-weight:600}
.survey-card .sopt.chosen .sidx{background:#fff;color:var(--accent)}
.survey-card .sopt.pending{opacity:.75}
.survey-card .sstatus{font-size:11px;color:var(--text-sub);margin-top:8px;text-align:right}

#typingTip{align-self:flex-start;display:flex;align-items:center;gap:7px;background:var(--typing-bg);border-radius:16px;padding:7px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;max-width:80%}
#typingTip .tav{width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0}
#typingTip .tav img{width:100%;height:100%;object-fit:cover}
#typingTip .ttxt{font-size:13px;color:var(--typing-text)}
#typingTip .dots{display:flex;gap:3px;margin-left:2px}
#typingTip .dots i{width:5px;height:5px;border-radius:50%;background:var(--typing-text);animation:blink 1.2s infinite}
#typingTip .dots i:nth-child(2){animation-delay:.2s}
#typingTip .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

#quoteBar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--divider)}
#quoteBar .qcontent{flex:1;font-size:12px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--accent);padding-left:8px}
#quoteBar .qclose{width:22px;height:22px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-sub)}

#inputArea{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--nav-bg);border-top:1px solid var(--divider)}
.ibtn{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--input-bg);color:var(--text);transition:.15s}
.ibtn:hover{filter:brightness(.94)}
.ibtn svg{width:19px;height:19px}
#msgInput{flex:1;min-width:0;height:38px;max-height:110px;border-radius:19px;border:1px solid var(--divider);background:var(--input-bg);color:var(--input-text);padding:0 14px;font-size:16px;outline:none;resize:none;line-height:38px;overflow:hidden}
#sendBtn{flex-shrink:0;height:38px;padding:0 16px;border-radius:19px;background:var(--accent);color:var(--btn-text);font-size:14px;font-weight:600;transition:.15s}
#sendBtn:hover{filter:brightness(.95)}

#ctxMenu{position:fixed;z-index:200;background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:120px}
#ctxMenu button{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--text);text-align:left}
#ctxMenu button:hover{background:var(--input-bg)}

#libPage{padding:0}
.lib-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--divider);background:var(--nav-bg)}
.lib-back{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--input-bg)}
.lib-back svg{width:18px;height:18px}
.lib-title{font-size:16px;font-weight:700}
.lib-tabs{flex-shrink:0;display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--divider);background:var(--nav-bg);overflow-x:auto;-webkit-overflow-scrolling:touch}
.lib-tab{padding:7px 14px;border-radius:16px;font-size:13px;color:var(--text-sub);white-space:nowrap;transition:.15s}
.lib-tab.active{background:var(--accent);color:var(--btn-text);font-weight:600}
.lib-panel{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.tbtn{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;background:var(--input-bg);font-size:12.5px;color:var(--text);transition:.15s}
.tbtn:hover{filter:brightness(.94)}
.tbtn svg{width:14px;height:14px}
.tbtn.danger{color:#e05a5a}
.badge{background:var(--accent);color:var(--btn-text);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.sel-all{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-sub)}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--divider);margin-bottom:6px}
.list-item:hover{background:var(--input-bg)}
.list-item .txt{flex:1;font-size:13.5px;line-height:1.4;word-break:break-word}
.list-item .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eee}
.list-item .del{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-sub);font-size:13px;flex-shrink:0}
.list-item .del:hover{background:rgba(224,90,90,.12);color:#e05a5a}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.empty-hint{text-align:center;color:var(--text-sub);font-size:13px;padding:30px 0}

.set-block{background:var(--panel);border:1px solid var(--divider);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.set-block h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:13.5px}
.set-row+.set-row{border-top:1px dashed var(--divider)}
.set-row .sub{font-size:11.5px;color:var(--text-sub);margin-top:2px;line-height:1.4}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#ccc;border-radius:24px;transition:.2s}
.switch .sl::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.sl{background:var(--accent)}
.switch input:checked+.sl::before{transform:translateX(20px)}
.range-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-sub)}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.set-input{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--divider);background:var(--input-bg);color:var(--input-text);font-size:16px;outline:none;margin-top:6px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:9px 12px;border-radius:10px;background:var(--input-bg);font-size:13px;color:var(--text);transition:.15s;text-align:center}
.btn:hover{filter:brightness(.94)}
.btn.primary{background:var(--accent);color:var(--btn-text);font-weight:600}
.btn.danger{color:#e05a5a}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:440px;max-height:86vh;max-height:86dvh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}
.modal.wide{max-width:520px}
.modal h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.modal h3 .x{width:28px;height:28px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-sub)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12.5px;color:var(--text-sub);margin-bottom:5px}
.form-row input[type=text],.form-row input[type=password],.form-row textarea,.form-row select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--divider);background:var(--input-bg);color:var(--input-text);font-size:16px;outline:none;resize:vertical}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--accent)}
.avatar-edit{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.avatar-edit .av{width:88px;height:88px;border-radius:50%;overflow:hidden;border:2px solid var(--avatar-border);background:#eee;display:flex;align-items:center;justify-content:center}
.avatar-edit .av img{width:100%;height:100%;object-fit:cover}
.avatar-edit .av .ph{font-size:30px;color:#bbb}
.avatar-btns{display:flex;gap:8px}
.avatar-btns button{padding:6px 12px;border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.theme-cell{border-radius:12px;padding:8px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--input-bg)}
.theme-cell.active{border-color:var(--accent)}
.theme-swatch{width:100%;height:38px;border-radius:8px;display:flex;overflow:hidden}
.theme-swatch span{flex:1}
.theme-name{font-size:11px;color:var(--text-sub);text-align:center;line-height:1.2}
.shape-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.shape-opt{padding:7px 12px;border-radius:10px;background:var(--input-bg);font-size:12.5px;color:var(--text);border:2px solid transparent}
.shape-opt.active{border-color:var(--accent);font-weight:600}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px}
.color-row input[type=color]{width:44px;height:30px;border:none;border-radius:8px;background:none;cursor:pointer;padding:0}
.mgr-block{margin-bottom:16px}
.mgr-block h4{margin:0 0 8px;font-size:13.5px;color:var(--text);display:flex;align-items:center;gap:6px}
.mgr-block .btn-row .btn{flex:1 1 calc(50% - 4px);min-width:0}
.confirm-text{font-size:14px;line-height:1.6;margin-bottom:18px;white-space:pre-wrap}
.confirm-btns{display:flex;gap:10px}
.confirm-btns .btn{flex:1}

.sv-opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sv-opt-row .num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--btn-text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sv-opt-row input{flex:1;padding:9px 11px;border-radius:9px;border:1px solid var(--divider);background:var(--input-bg);color:var(--input-text);font-size:16px;outline:none}
.sv-opt-row input:focus{border-color:var(--accent)}
.sv-opt-row .rm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-sub);font-size:14px;flex-shrink:0}
.sv-opt-row .rm:hover{background:rgba(224,90,90,.12);color:#e05a5a}
.sv-hint{font-size:11.5px;color:var(--text-sub);margin-top:2px}

/* ============ 信件样式（跟随主题） ============ */
.letter-paper{background:var(--panel);border:1px solid var(--divider);border-radius:14px;padding:18px 16px;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 4px 16px rgba(0,0,0,.06);line-height:1.8;font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word;background-image:repeating-linear-gradient(to bottom,transparent,transparent 27px,var(--divider) 27px,var(--divider) 28px);background-position:0 8px}
.letter-paper::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:rgba(200,90,90,.35)}
.letter-stamp{position:absolute;right:12px;top:12px;width:54px;height:64px;border:2px dashed var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;transform:rotate(6deg);opacity:.85;background:rgba(255,255,255,.4)}
.letter-stamp .stamp-inner{font-size:9px;letter-spacing:1px;text-align:center;color:var(--text);line-height:1.3}
.letter-head{font-size:12px;color:var(--text-sub);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.letter-sign{text-align:right;margin-top:14px;font-size:13px;color:var(--text-sub)}
.letter-envelope{background:var(--input-bg);border:1px solid var(--divider);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.letter-envelope:hover{filter:brightness(.97)}
.letter-envelope .env-ic{width:46px;height:46px;flex-shrink:0;color:var(--accent)}
.letter-envelope .env-info{flex:1;min-width:0}
.letter-envelope .env-title{font-size:14px;font-weight:600;color:var(--text)}
.letter-envelope .env-sub{font-size:11.5px;color:var(--text-sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.letter-envelope .env-status{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--accent);color:var(--btn-text);font-weight:600;flex-shrink:0}
.letter-envelope.unread{border:2px solid var(--accent)}
.letter-envelope.pending .env-status{background:var(--divider);color:var(--text-sub)}

/* 信件提示条 */
#letterToast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);background:var(--accent);color:var(--btn-text);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:600;opacity:0;transition:.3s;cursor:pointer;display:flex;align-items:center;gap:8px;max-width:90vw}
#letterToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#letterToast svg{width:20px;height:20px;flex-shrink:0}

#toast{position:fixed;bottom:28px;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;z-index:500;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:520px){
  #app{max-width:100vw;height:100vh;height:100dvh;border-radius:0}
  .bubble{font-size:14px}
  .msg-body{max-width:calc(100% - 70px)}
  #chatTop{padding:6px 10px;gap:6px}
  .hero-avatar .av{width:42px;height:42px}
  .ecg{width:48px;height:42px}
  .ecg svg{width:48px;height:42px}
  .func-btn{width:22px;height:22px}
  .func-btn svg{width:12px;height:12px}
  .hero-avatar .nm{max-width:48px;font-size:10.5px}
}
</style>
</head>

<script>
/* ================= 全局状态 ================= */
const DB_NAME='dream_chat_images', DB_STORE='images';
let db=null;
const S={
  session:{username:'__guest__'},
  dreams:[],
  activeDreamId:null,
  data:null,
  dbImg:{},
  currentPage:'home',
  currentLibTab:'cards',
  quote:null, typingTimer:null, activeProactiveTimer:null,
  longPressTimer:null, editingProfile:null, typingEl:null
};

/* ================= IndexedDB ================= */
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(DB_STORE))d.createObjectStore(DB_STORE)};
    r.onsuccess=e=>{db=e.target.result;res()};
    r.onerror=e=>rej(e);
  });
}
function idbKey(dreamId,imgKey){return '__guest__::'+dreamId+'::'+imgKey}
function idbPut(dreamId,imgKey,dataURL){return new Promise((res,rej)=>{const t=db.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).put(dataURL,idbKey(dreamId,imgKey));t.oncomplete=()=>res();t.onerror=e=>rej(e)})}
function idbGet(dreamId,imgKey){return new Promise((res)=>{const t=db.transaction(DB_STORE,'readonly');const rq=t.objectStore(DB_STORE).get(idbKey(dreamId,imgKey));rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)})}
function idbDel(dreamId,imgKey){return new Promise((res)=>{const t=db.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).delete(idbKey(dreamId,imgKey));t.oncomplete=()=>res();t.onerror=()=>res()})}
async function idbDelByDream(dreamId){return new Promise((res)=>{const t=db.transaction(DB_STORE,'readwrite');const st=t.objectStore(DB_STORE);const rq=st.openCursor();const p='__guest__::'+dreamId+'::';const keys=[];rq.onsuccess=e=>{const c=e.target.result;if(c){if(c.key.startsWith(p))keys.push(c.key);c.continue()}else{keys.forEach(k=>st.delete(k))}};t.oncomplete=()=>res();t.onerror=()=>res()})}

/* ================= 持久化 ================= */
const DREAMS_KEY='dream_chat_dreams___guest__';
const LETTERS_KEY='dream_chat_letters___guest__';
function getDataKey(dreamId){return 'dream_chat_data___guest__::'+dreamId}
function genId(){return 'd'+Date.now()+'_'+Math.floor(Math.random()*9999)}
function loadDreams(){
  try{S.dreams=JSON.parse(localStorage.getItem(DREAMS_KEY)||'[]')}catch(e){S.dreams=[]}
  if(!Array.isArray(S.dreams))S.dreams=[];
}
function saveDreams(){localStorage.setItem(DREAMS_KEY,JSON.stringify(S.dreams))}
function loadLetters(){try{return JSON.parse(localStorage.getItem(LETTERS_KEY)||'[]')}catch(e){return[]}}
function saveLetters(list){localStorage.setItem(LETTERS_KEY,JSON.stringify(list))}
function defaultData(dreamName){
  return {
    messages:[], user:{name:'我',avatarKey:null}, dream:{name:dreamName||'夢角',avatarKey:null},
    cards:[
      '今天也想你了。','你在做什麼呢？','記得早點休息喔。','我一直都在這裡。','抱抱你，辛苦了。',
      '今天的你也很棒。','要不要跟我說說心裡話？','我喜歡聽你說話。','不管發生什麼，我都站在你這邊。',
      '想見你的心情，藏不住呢。','你笑起來一定很好看。','別擔心，有我在。',
      '慢慢來，不用急。','謝謝你願意告訴我。','晚安，做個好夢。'
    ],
    kaomoji:['(๑•̀ㅂ•́)و✧','(｡･ω･｡)','(〃∀〃)','(๑´ㅂ`๑)','(つд⊂)','(๑•́ ₃ •̀๑)','(；´д｀)','(◍•ᴗ•◍)','(๑>ᴗ<๑)','♡','(´▽`ʃ♡ƪ)','(๑ơ ₃ ơ)♥','(っ˘ω˘ς)','(๑•̀ㅂ•́)و','(・∀・)','(´,,•ω•,,)♡','(๑￫ܫ￩)'],
    stickers:[], settings:{
      showRead:false, quoteEnabled:true, maxDelay:5,
      proactive:false, proactiveMin:1, proactiveMax:300,
      callProactive:false, typingTip:true, typingText:'夢角正在輸入...', typingAvatar:true
    },
    theme:'cream', shape:'tail', customColors:null, hasChatBgImage:false, bgImageKey:null, nextId:1,
    starDeco:false
  };
}

async function loadActiveData(){
  const did=S.activeDreamId;
  if(!did){S.data=null;S.dbImg={};return}
  let raw=localStorage.getItem(getDataKey(did));
  const meta=S.dreams.find(d=>d.id===did);
  if(!raw){
    S.data=defaultData(meta?meta.name:'夢角');
    if(meta&&meta.avatarKey)S.data.dream.avatarKey=meta.avatarKey;
    localStorage.setItem(getDataKey(did),JSON.stringify(S.data));
  }else{
    try{S.data=JSON.parse(raw)}catch(e){S.data=defaultData(meta?meta.name:'夢角')}
  }
  const d=defaultData(meta?meta.name:'夢角');
  for(const k in d){if(!(k in S.data))S.data[k]=d[k]}
  for(const k in d.settings){if(!(k in S.data.settings))S.data.settings[k]=d.settings[k]}
  if(meta&&meta.avatarKey)S.data.dream.avatarKey=meta.avatarKey;
  S.dbImg={};
  const keys=new Set();
  if(S.data.user.avatarKey)keys.add(S.data.user.avatarKey);
  if(S.data.dream.avatarKey)keys.add(S.data.dream.avatarKey);
  if(S.data.bgImageKey)keys.add(S.data.bgImageKey);
  S.data.stickers.forEach(s=>{if(s.key)keys.add(s.key)});
  for(const k of keys){const v=await idbGet(did,k);if(v)S.dbImg[k]=v}
  for(const m of S.data.messages){if((m.type==='image'||m.type==='sticker')&&m.imageKey){const v=await idbGet(did,m.imageKey);if(v)S.dbImg[m.imageKey]=v}}
}
function saveData(){
  if(!S.data||!S.activeDreamId)return;
  localStorage.setItem(getDataKey(S.activeDreamId),JSON.stringify(S.data));
  const meta=S.dreams.find(d=>d.id===S.activeDreamId);
  if(meta){meta.name=S.data.dream.name;meta.avatarKey=S.data.dream.avatarKey;saveDreams()}
}

/* ================= 工具 ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function now(){return Date.now()}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDate(ts){const d=new Date(ts);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function fmtDateTime(ts){const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${fmtTime(ts)}`}
function sameDay(a,b){const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate()}
function uid(){S.data.nextId=(S.data.nextId||1)+1;return S.data.nextId}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1800)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}

/* ================= 主题 ================= */

function applyTheme(){
  let theme='cream',shape='tail',customColors=null,starDeco=false;
  if(S.data){
    theme=S.data.theme||'cream';shape=S.data.shape||'tail';customColors=S.data.customColors;starDeco=S.data.starDeco;
  }else if(S.dreams.length){
    // 主页用第一个梦角的主题做预览
    try{
      const raw=localStorage.getItem(getDataKey(S.dreams[0].id));
      if(raw){const dd=JSON.parse(raw);theme=dd.theme||'cream';shape=dd.shape||'tail';customColors=dd.customColors;starDeco=dd.starDeco}
    }catch(e){}
  }
  const t=THEMES[theme]||THEMES.cream;
  const vars=Object.assign({},t.vars);
  if(customColors){for(const k in customColors)vars[k]=customColors[k]}
  if(customColors&&customColors['--bg']){
    const c=customColors['--bg'];
    if(isDark(c)){vars['--text']='#f0f0f0';vars['--text-sub']='#b0b0b0'}
    else{vars['--text']='#2b2b2b';vars['--text-sub']='#8a8a8a'}
  }
  const root=document.documentElement;
  for(const k in vars)root.style.setProperty(k,vars[k]);
  let ur='18px',ut='block',dt='block';
  if(shape==='round'){ur='18px';ut='none';dt='none'}
  else if(shape==='capsule'){ur='22px';ut='none';dt='none'}
  else if(shape==='rect'){ur='6px';ut='none';dt='none'}
  root.style.setProperty('--bubble-radius',ur);
  root.style.setProperty('--user-tail',ut);
  root.style.setProperty('--dream-tail',dt);
  root.style.setProperty('--star-deco',starDeco?'block':'none');
}
function isDark(hex){
  let c=hex.replace('#','');
  if(c.length===3)c=c.split('').map(x=>x+x).join('');
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)<128;
}

/* ================= 信件 ================= */
/* 信件结构：{ id, dreamId, fromName, toName, body, sentAt, replyAt, replyBody, read, gotReply } */
function hoursBetween(a,b){return (b-a)/3600000}

function checkLetterReplies(){
  // 读取所有信件，检查是否有到时间但还没生成回信的，生成回信
  const list=loadLetters();
  let changed=false;
  const nowTs=now();
  list.forEach(L=>{
    if(!L.gotReply && L.replyAt && nowTs>=L.replyAt){
      // 从该梦角的字卡中拼回信
      let cards=[];
      try{
        const raw=localStorage.getItem(getDataKey(L.dreamId));
        if(raw){const dd=JSON.parse(raw);cards=(dd.cards||[]).slice()}
      }catch(e){}
      if(!cards.length)cards=['我收到你的信了。','謝謝你寫信給我。','我也很想你。','期待與你再見。'];
      // 随机挑 3-5 句拼接
      const n=randInt(3,5);
      const picked=[];
      for(let i=0;i<n;i++){picked.push(cards[Math.floor(Math.random()*cards.length)])}
      L.replyBody=picked.join('\n');
      L.gotReply=true;
      L.repliedAt=nowTs;
      changed=true;
    }
  });
  if(changed)saveLetters(list);
  return list;
}
function unreadLettersCount(){
  const list=checkLetterReplies();
  return list.filter(L=>L.gotReply&&!L.read).length;
}

  const c=unreadLettersCount();
  const b=document.getElementById('inboxBadge');

function showLetterToast(){
  const list=checkLetterReplies();
  const unread=list.filter(L=>L.gotReply&&!L.read);
  if(!unread.length)return;
  const t=document.getElementById('letterToast');
  const first=unread[0];
  t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>${esc(first.toName)} 回信了！點擊查看</span>`;
  t.classList.add('show');
  t.onclick=()=>{
    t.classList.remove('show');
    openLetterDetail(first.id);
  };
  clearTimeout(t._tm);
  t._tm=setTimeout(()=>t.classList.remove('show'),8000);
}

/* ================= 主頁渲染 ================= */
async function renderHome(){
  renderInboxBadge();
  const list=document.getElementById('homeList');
  list.innerHTML='';
  const metas=await Promise.all(S.dreams.map(async d=>{
    let src='';
    if(d.avatarKey){src=await idbGet(d.id,d.avatarKey)||''}
    let last='點擊開始聊天';
    try{
      const raw=localStorage.getItem(getDataKey(d.id));
      if(raw){
        const data=JSON.parse(raw);
        if(data.messages&&data.messages.length){
          const lastMsg=data.messages[data.messages.length-1];
          if(lastMsg.type==='text')last=lastMsg.text;
          else if(lastMsg.type==='image')last='[圖片]';
          else if(lastMsg.type==='sticker')last='[表情]';
          else if(lastMsg.type==='survey')last='[問卷] '+(lastMsg.text||'');
          else if(lastMsg.type==='sys')last=lastMsg.text||'';
        }
      }
    }catch(e){}
    return Object.assign({},d,{_avatarSrc:src,_last:last});
  }));
  if(!metas.length){
    list.innerHTML=`<div class="home-empty">還沒有夢角喔～<br>點右下角「＋」新增第一個夢角吧！</div>`;
    return;
  }
  metas.forEach(d=>{
    const card=document.createElement('div');
    card.className='dream-card';
    card.dataset.id=d.id;
    card.innerHTML=`
      <div class="dc-av">${d._avatarSrc?`<img src="${d._avatarSrc}" alt="">`:`<div class="ph" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:18px">✦</div>`}</div>
      <div class="dc-info">
        <div class="dc-name">${esc(d.name||'夢角')}</div>
        <div class="dc-last">${esc(d._last)}</div>
      </div>`;
    card.onclick=()=>enterDream(d.id);
    let lp=null;
    card.addEventListener('touchstart',e=>{lp=setTimeout(()=>{lp=null;confirmDeleteDream(d)},600)},{passive:true});
    card.addEventListener('touchend',()=>{if(lp){clearTimeout(lp);lp=null}});
    card.addEventListener('touchmove',()=>{if(lp){clearTimeout(lp);lp=null}});
    card.addEventListener('contextmenu',e=>{e.preventDefault();confirmDeleteDream(d)});
    list.appendChild(card);
  });
}
function confirmDeleteDream(d){
  confirmDialog('刪除夢角',`確定刪除「${d.name||'夢角'}」嗎？\n該夢角的所有聊天記錄、字卡、表情包與設定都會一併刪除。`,async()=>{
    localStorage.removeItem(getDataKey(d.id));
    await idbDelByDream(d.id);
    // 相关信件也删除
    const letters=loadLetters().filter(L=>L.dreamId!==d.id);
    saveLetters(letters);
    S.dreams=S.dreams.filter(x=>x.id!==d.id);
    saveDreams();renderHome();renderInboxBadge();toast('已刪除');
  });
}

  const {ov,close}=modal(`

    <div class="avatar-edit">
      <div class="av" id="ndAv"><div class="ph">✦</div></div>

    </div>
    <div class="form-row"><label>名字</label><input type="text" id="ndName" placeholder="夢角的名字" maxlength="20"></div>
    <div class="btn-row">
      <button class="btn" id="ndCancel">取消</button>
      <button class="btn primary" id="ndCreate">建立並聊天</button>
    </div>`);
  ov.querySelector('#ndCancel').onclick=close;
  ov.querySelector('#ndUpload').onclick=()=>{
    const inp=document.getElementById('hiddenFile');
    inp.accept='image/*';inp.value='';inp.onchange=()=>{
      const f=inp.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{avatarData=rd.result;ov.querySelector('#ndAv').innerHTML=`<img src="${avatarData}" alt="">`};
      rd.readAsDataURL(f);
    };
    inp.click();
  };
  ov.querySelector('#ndCreate').onclick=async()=>{
    const name=ov.querySelector('#ndName').value.trim();
    if(!name){toast('請輸入名字');return}
    const id=genId();
    let avatarKey=null;
    if(avatarData){
      const key='avatar_dream_'+id;
      await idbPut(id,key,avatarData);
      avatarKey=key;
    }
    S.dreams.push({id,name,avatarKey});saveDreams();
    close();enterDream(id);toast('已建立夢角');
  };
}

async function enterDream(id){
  S.activeDreamId=id;
  const meta=S.dreams.find(d=>d.id===id);
  await loadActiveData();
  if(meta){
    if(!S.data.dream.name)S.data.dream.name=meta.name;
    S.data.dream.avatarKey=meta.avatarKey;
  }
  applyTheme();
  showPage('chat');
  renderChatTop();renderMessages();renderLibAll();
  setupProactive();setupCallProactive();
}

  clearTimeout(S.activeProactiveTimer);
  clearInterval(callProTimer);
  hideTyping();
  if(CALL.state)endCall('hang');
  S.activeDreamId=null;S.data=null;S.dbImg={};
  applyTheme();
  showPage('home');
  renderHome();
  // 进入主页再检查一次信件提醒
  setTimeout(showLetterToast,300);
}
function showPage(p){
  S.currentPage=p;
  document.getElementById('homePage').classList.toggle('hidden',p!=='home');
  document.getElementById('chatPage').classList.toggle('hidden',p!=='chat');
  document.getElementById('libPage').classList.toggle('hidden',p!=='lib');
  const back=document.getElementById('navBack');
  const title=document.getElementById('navTitle');
  if(p==='home'){back.classList.add('hidden');title.textContent='聊天室'}
  else{back.classList.remove('hidden');title.textContent=S.data?('與 '+(S.data.dream.name||'夢角')+' 聊天'):'聊天'}
}

/* ================= 渲染聊天 ================= */
function avatarHTML(key){
  if(key&&S.dbImg[key])return `<img src="${S.dbImg[key]}" alt="">`;
  return `<div class="ph" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:16px">✦</div>`;
}
function renderChatTop(){
  if(!S.data)return;
  const d=S.data;
  document.getElementById('userHeroName').textContent=d.user.name||'我';
  document.getElementById('dreamHeroName').textContent=d.dream.name||'夢角';
  document.getElementById('userHeroAv').innerHTML=avatarHTML(d.user.avatarKey);
  document.getElementById('dreamHeroAv').innerHTML=avatarHTML(d.dream.avatarKey);
}
function surveyCardHTML(m){
  const answered=m.surveyAnswer!=null;
  const opts=(m.options||[]).map((o,i)=>{
    let cls='sopt';
    if(answered){if(i===m.surveyAnswer)cls+=' chosen';else cls+=' pending'}
    return `<div class="${cls}"><span class="sidx">${i+1}</span><span>${esc(o)}</span></div>`;
  }).join('');
  const status=answered?`夢角選擇了：${esc(m.options[m.surveyAnswer])}`:`等待夢角回答中...`;
  return `<div class="survey-card"><div class="stitle">📋 ${esc(m.text||'問卷')}</div>${opts}<div class="sstatus">${answered?'✓ ':''}${status}</div></div>`;
}
function renderMessages(){
  if(!S.data)return;
  const list=document.getElementById('msgList');
  const d=S.data;
  list.innerHTML='';
  let lastTs=0;
  if(d.hasChatBgImage&&d.bgImageKey&&S.dbImg[d.bgImageKey])list.style.backgroundImage=`url(${S.dbImg[d.bgImageKey]})`;
  else list.style.backgroundImage='none';
  d.messages.forEach(m=>{
    if(m.type==='sys'){
      if(!sameDay(lastTs,m.ts)){list.appendChild(dateDiv(m.ts));lastTs=m.ts}
      const row=document.createElement('div');row.className='sys-center';
      row.innerHTML=`<div class="sys-pill">${esc(m.text)}</div>`;
      list.appendChild(row);return;
    }
    if(!sameDay(lastTs,m.ts)){list.appendChild(dateDiv(m.ts));lastTs=m.ts}
    const row=document.createElement('div');
    row.className='msg-row '+(m.from==='user'?'user':'dream');
    row.dataset.id=m.id;
    const isUser=m.from==='user';
    const who=isUser?d.user:d.dream;
    let content='';
    if(m.quote){content+=`<div class="quote"><b>${esc(m.quote.name)}</b>：${esc(m.quote.text)}</div>`}
    if(m.type==='survey'){content+=surveyCardHTML(m)}
    else if(m.type==='image'){
      const src=m.imageKey&&S.dbImg[m.imageKey]?S.dbImg[m.imageKey]:'';
      content+=src?`<img class="chat-img" src="${src}" alt="">`:`<span style="color:#999">[圖片]</span>`;
    }else if(m.type==='sticker'){
      const src=m.imageKey&&S.dbImg[m.imageKey]?S.dbImg[m.imageKey]:'';
      content+=src?`<img class="msg-sticker" src="${src}" alt="">`:`<span style="color:#999">[表情]</span>`;
    }else content+=esc(m.text);
    let readHtml='';
    if(d.settings.showRead&&isUser){readHtml=`<div class="read-mark">${m.read?'已讀':'未讀'}</div>`}
    const starCls=(!isUser&&d.starDeco)?' star-deco':'';
    row.innerHTML=`
      <div class="mav">${avatarHTML(who.avatarKey)}</div>
      <div class="msg-body">
        <div class="msg-meta">
          <span class="msg-name">${esc(who.name||(isUser?'我':'夢角'))}</span>
          <span class="msg-time">${fmtTime(m.ts)}</span>
        </div>
        <div class="bubble${starCls}">${content}</div>
        ${readHtml}
      </div>`;
    row.addEventListener('contextmenu',e=>{e.preventDefault();openCtx(e.clientX,e.clientY,m.id)});
    row.addEventListener('touchstart',e=>{
      const t=e.touches[0];
      S.longPressTimer=setTimeout(()=>{S.longPressTimer=null;openCtx(t.clientX,t.clientY,m.id)},500);
    },{passive:true});
    row.addEventListener('touchend',()=>{if(S.longPressTimer){clearTimeout(S.longPressTimer);S.longPressTimer=null}});
    row.addEventListener('touchmove',()=>{if(S.longPressTimer){clearTimeout(S.longPressTimer);S.longPressTimer=null}});
    row.addEventListener('touchstart',e=>{e.stopPropagation()},{passive:true});
    list.appendChild(row);
  });
  if(S.typingEl)list.appendChild(S.typingEl);
  list.scrollTop=list.scrollHeight;
}
function dateDiv(ts){const d=document.createElement('div');d.className='date-divider';d.innerHTML=`<span>${fmtDate(ts)}</span>`;return d}

/* ================= 发消息 ================= */
function pushMsg(m){
  m.ts=m.ts||now();
  m.id=uid();
  S.data.messages.push(m);
  saveData();renderMessages();
  return m;
}
function sendUserText(){
  const inp=document.getElementById('msgInput');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';inp.style.height='38px';
  const m={from:'user',type:'text',text,read:false};
  if(S.quote){m.quote={name:S.quote.name,text:S.quote.text};S.quote=null;hideQuoteBar()}
  pushMsg(m);scheduleDreamReply();
}
function sendUserImage(dataURL){
  const did=S.activeDreamId;
  const key='chat_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  idbPut(did,key,dataURL).then(()=>{S.dbImg[key]=dataURL});
  const m={from:'user',type:'image',imageKey:key,read:false};
  if(S.quote){m.quote={name:S.quote.name,text:S.quote.text};S.quote=null;hideQuoteBar()}
  pushMsg(m);scheduleDreamReply();
}
function sendUserSticker(sticker){
  const m={from:'user',type:'sticker',imageKey:sticker.key,read:false};
  pushMsg(m);scheduleDreamReply();
}

/* ================= 问卷 ================= */
function sendSurvey(title,options){
  const m={from:'user',type:'survey',text:title,options:options.slice(),read:false,surveyAnswer:null};
  pushMsg(m);scheduleSurveyAnswer(m.id);
}
function scheduleSurveyAnswer(msgId){
  const maxDelay=Math.max(1,parseInt(S.data.settings.maxDelay)||5);
  const delay=randInt(1,maxDelay)*1000;
  showTyping();
  clearTimeout(S.typingTimer);
  S.typingTimer=setTimeout(()=>{
    const typeDur=randInt(1000,2500);
    clearTimeout(S.typingTimer);
    S.typingTimer=setTimeout(()=>{
      hideTyping();
      const m=S.data.messages.find(x=>x.id===msgId);
      if(!m||m.type!=='survey'||m.surveyAnswer!=null)return;
      const idx=Math.floor(Math.random()*(m.options||[]).length);
      m.surveyAnswer=idx;m.answeredAt=now();
      saveData();renderMessages();
      setTimeout(()=>{pushMsg({from:'dream',type:'text',text:`我選了「${m.options[idx]}」✨`,read:false})},400);
    },typeDur);
  },delay);
}

/* ================= 梦角回复 ================= */
function dreamPickReply(){
  const d=S.data;
  const pool=[].concat(d.cards||[],d.kaomoji||[]);
  if(pool.length===0)return '……';
  return pick(pool);
}
function showTyping(){
  hideTyping();
  if(!S.data||!S.data.settings.typingTip)return;
  const el=document.createElement('div');el.id='typingTip';
  const avHtml=S.data.settings.typingAvatar?`<div class="tav">${avatarHTML(S.data.dream.avatarKey)}</div>`:'';
  el.innerHTML=`${avHtml}<span class="ttxt">${esc(S.data.settings.typingText||'夢角正在輸入...')}</span><span class="dots"><i></i><i></i><i></i></span>`;
  el.addEventListener('click',()=>{
    const t=prompt('修改提示文字：',S.data.settings.typingText||'夢角正在輸入...');
    if(t!=null&&t.trim()!==''){S.data.settings.typingText=t.trim();saveData();const tt=el.querySelector('.ttxt');if(tt)tt.textContent=t.trim()}
  });
  S.typingEl=el;
  const list=document.getElementById('msgList');
  list.appendChild(el);
  list.scrollTop=list.scrollHeight;
}
function hideTyping(){if(S.typingEl&&S.typingEl.parentNode)S.typingEl.parentNode.removeChild(S.typingEl);S.typingEl=null}
function scheduleDreamReply(){
  if(!S.data)return;
  const maxDelay=Math.max(1,parseInt(S.data.settings.maxDelay)||5);
  const delay=randInt(1,maxDelay)*1000;
  clearTimeout(S.typingTimer);
  S.typingTimer=setTimeout(()=>{
    showTyping();
    const typeDur=randInt(1000,2500);
    clearTimeout(S.typingTimer);
    S.typingTimer=setTimeout(()=>{
      hideTyping();
      let quote=null;
      if(S.data.settings.quoteEnabled&&Math.random()<0.4){
        const users=S.data.messages.filter(x=>x.from==='user'&&(x.type==='text'||x.type==='image'||x.type==='sticker'));
        if(users.length){
          const q=pick(users);
          quote={name:S.data.user.name||'我',text:q.type==='text'?q.text:(q.type==='image'?'[圖片]':'[表情]')};
        }
      }
      const m={from:'dream',type:'text',text:dreamPickReply(),read:false};
      if(quote)m.quote=quote;
      pushMsg(m);
    },typeDur);
  },delay);
}
function triggerContinue(){scheduleDreamReply()}

      <button class="btn primary" id="svSend">發送問卷</button>
    </div>`);
  let opts=['',''];

    const box=ov.querySelector('#svOpts');
    box.innerHTML=opts.map((v,i)=>`
      <div class="sv-opt-row">
        <span class="num">${i+1}</span>
        <input type="text" data-i="${i}" value="${esc(v)}" placeholder="選項 ${i+1}" maxlength="40">
        ${opts.length>2?`<button class="rm" data-rm="${i}">✕</button>`:''}
      </div>`).join('');
    box.querySelectorAll('input').forEach(inp=>{inp.oninput=()=>{opts[+inp.dataset.i]=inp.value}});
    box.querySelectorAll('.rm').forEach(b=>{b.onclick=()=>{opts.splice(+b.dataset.rm,1);renderOpts()}});
    ov.querySelector('#svAdd').style.display=opts.length>=5?'none':'inline-flex';
  }
  renderOpts();
  ov.querySelector('#svAdd').onclick=()=>{if(opts.length<5){opts.push('');renderOpts()}};
  ov.querySelector('#svCancel').onclick=close;
  ov.querySelector('#svSend').onclick=()=>{
    const title=ov.querySelector('#svTitle').value.trim();

/* ================= 引用 / 右键菜单 ================= */
function openCtx(x,y,id){
  closeCtx();S.ctxMsgId=id;
  const menu=document.createElement('div');menu.id='ctxMenu';
  menu.innerHTML=`
    <button data-act="quote">💬 引用</button>
    <button data-act="copy">📋 複製</button>
    <button data-act="del">🗑️ 刪除</button>`;
  menu.style.left=Math.min(x,window.innerWidth-140)+'px';
  menu.style.top=Math.min(y,window.innerHeight-140)+'px';
  document.body.appendChild(menu);
  menu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const act=b.dataset.act;const m=S.data.messages.find(x=>x.id===id);
    if(!m){closeCtx();return}
    if(act==='quote'){
      const txt=m.type==='text'?m.text:(m.type==='survey'?`[問卷] ${m.text||''}`:(m.type==='image'?'[圖片]':(m.type==='sticker'?'[表情]':'[系統]')));
      S.quote={name:m.from==='user'?(S.data.user.name||'我'):(S.data.dream.name||'夢角'),text:txt};
      showQuoteBar();
    }else if(act==='copy'){
      if(m.type==='text'){navigator.clipboard&&navigator.clipboard.writeText(m.text).then(()=>toast('已複製')).catch(()=>toast('複製失敗'))}
      else toast('此訊息無法複製');
    }else if(act==='del'){
      confirmDialog('刪除訊息','確定要刪除這則訊息嗎？',()=>{
        if(m.type==='image'||m.type==='sticker'){if(m.imageKey)idbDel(S.activeDreamId,m.imageKey);delete S.dbImg[m.imageKey]}
        S.data.messages=S.data.messages.filter(x=>x.id!==id);saveData();renderMessages();
      });
    }
    closeCtx();
  }));
  setTimeout(()=>document.addEventListener('click',closeCtx,{once:true}),0);
}
function closeCtx(){const e=document.getElementById('ctxMenu');if(e)e.remove()}
function showQuoteBar(){if(!S.quote)return;document.getElementById('quoteBar').classList.remove('hidden');document.getElementById('quoteContent').textContent=`${S.quote.name}：${S.quote.text}`}
function hideQuoteBar(){document.getElementById('quoteBar').classList.add('hidden');S.quote=null}

/* ================= 弹窗系统 ================= */
function modal(html,opts){
  opts=opts||{};
  const root=document.getElementById('modalRoot');
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal ${opts.wide?'wide':''}">${html}</div>`;
  root.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov&&!opts.noClose)ov.remove()});
  const x=ov.querySelector('.x');if(x)x.addEventListener('click',()=>ov.remove());
  return {ov,close:()=>ov.remove()};
}
function confirmDialog(title,text,onOk){
  const {ov,close}=modal(`<h3>${esc(title)}<button class="x">✕</button></h3><div class="confirm-text">${esc(text)}</div><div class="confirm-btns"><button class="btn" id="cNo">取消</button><button class="btn danger" id="cYes">確定</button></div>`);
  ov.querySelector('#cNo').onclick=close;
  ov.querySelector('#cYes').onclick=()=>{close();onOk&&onOk()};
}

function openProfileEdit(which){
  if(!S.data)return;

  const who=isUser?S.data.user:S.data.dream;

      <button class="btn" data-act="import-chat">僅匯入聊天記錄</button>
      <button class="btn" data-act="import-lib">僅匯入字卡庫</button>
    </div></div>
    <div class="mgr-block"><h4>🧹 清除</h4><div class="btn-row">

    </div></div>
    <div class="mgr-block"><h4>♻️ 重置</h4><div class="btn-row">
      <button class="btn danger" data-act="reset">重置當前夢角設定</button>
    </div></div>`,{wide:true});
  ov.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.act;
    if(act==='backup-all')backupAll();
    else if(act==='backup-chat')backupChat();
    else if(act==='backup-lib')backupLib();
    else if(act==='import-all')importFile('all');
    else if(act==='import-chat')importFile('chat');
    else if(act==='import-lib')importFile('lib');
    else if(act==='clear-chat')confirmDialog('清除聊天記錄','確定清除此夢角的所有聊天記錄？此操作無法復原。',()=>{S.data.messages.forEach(m=>{if(m.imageKey)idbDel(S.activeDreamId,m.imageKey)});S.data.messages=[];saveData();renderMessages();toast('聊天記錄已清除')});
    else if(act==='clear-lib')confirmDialog('清除字卡庫','確定清除此夢角的所有字卡、顏文字、表情包？',()=>{S.data.cards=[];S.data.kaomoji=[];S.data.stickers.forEach(s=>{if(s.key)idbDel(S.activeDreamId,s.key)});S.data.stickers=[];saveData();toast('字卡庫已清除')});
    else if(act==='reset')confirmDialog('重置當前夢角設定','確定恢復此夢角的預設值？將清空聊天記錄、字卡庫、頭像、背景圖與設定。',()=>resetActive());
  });
  function backupAll(){downloadJSON({type:'all',data:S.data},'dream_'+S.activeDreamId+'_all_'+Date.now()+'.json')}
  function backupChat(){downloadJSON({type:'chat',messages:S.data.messages,user:S.data.user,dream:S.data.dream},'dream_'+S.activeDreamId+'_chat_'+Date.now()+'.json')}
  function backupLib(){downloadJSON({type:'lib',cards:S.data.cards,kaomoji:S.data.kaomoji,stickers:S.data.stickers.map(s=>({key:s.key}))},'dream_'+S.activeDreamId+'_lib_'+Date.now()+'.json')}
  function downloadJSON(obj,name){
    const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }
  function importFile(mode){
    const inp=document.getElementById('hiddenFile');
    inp.accept='.json,application/json';inp.value='';inp.onchange=()=>{
      const f=inp.files[0];if(!f)return;
      const rd=new FileReader();rd.onload=()=>{try{handleImport(JSON.parse(rd.result),mode)}catch(e){toast('檔案格式錯誤')}};rd.readAsText(f);
    };inp.click();
  }
  async function handleImport(obj,mode){
    if(mode==='all'){
      if(!obj.data){toast('無效的備份檔');return}
      S.data=Object.assign(defaultData(S.data.dream.name),obj.data);
      saveData();await loadActiveData();applyTheme();renderChatTop();renderMessages();renderLibAll();
      toast('全部資料已匯入');
    }else if(mode==='chat'){
      if(obj.messages){S.data.messages=obj.messages;if(obj.user)S.data.user=obj.user;if(obj.dream)S.data.dream=obj.dream;saveData();renderChatTop();renderMessages();toast('聊天記錄已匯入')}
    }else if(mode==='lib'){
      if(obj.cards)S.data.cards=obj.cards;
      if(obj.kaomoji)S.data.kaomoji=obj.kaomoji;
      saveData();renderLibAll();toast('字卡庫已匯入');
    }
  }
  async function resetActive(){
    await idbDelByDream(S.activeDreamId);
    S.dbImg={};
    S.data=defaultData(S.data.dream.name);
    const meta=S.dreams.find(d=>d.id===S.activeDreamId);
    if(meta){S.data.dream.avatarKey=meta.avatarKey}
    saveData();applyTheme();renderChatTop();renderMessages();renderLibAll();
    toast('已重置');close();
  }
}

function mergeCards(lines){
  const ex=new Set(S.data.cards);let n=0;
  lines.forEach(l=>{if(!ex.has(l)){ex.add(l);S.data.cards.push(l);n++}});
  saveData();renderCardsPanel();toast(`新增 ${n} 則字卡`);
}

      const files=[...inp.files].slice(0,100);if(!files.length)return;
      const dataURLs=await Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})));
      const existingData=new Set(S.data.stickers.map(s=>S.dbImg[s.key]).filter(Boolean));

        await idbPut(S.activeDreamId,key,d);S.dbImg[key]=d;S.data.stickers.push({key});added++;
      }
      saveData();renderStickersPanel();toast(`新增 ${added} 個表情包`);
    };inp.click();
  };
  el.querySelector('#stkExport').onclick=()=>{
    const blob=new Blob([JSON.stringify({type:'stickers',stickers:list.map(s=>({key:s.key}))},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dream_stickers_'+Date.now()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  el.querySelector('#stkDel').onclick=()=>{
    const sel=[...el.querySelectorAll('.stk-chk:checked')].map(c=>+c.dataset.i);
    if(!sel.length){toast('請先選擇');return}
    confirmDialog('刪除表情包',`確定刪除選中的 ${sel.length} 個表情包？`,()=>{
      sel.forEach(i=>{const s=S.data.stickers[i];if(s&&s.key){idbDel(S.activeDreamId,s.key);delete S.dbImg[s.key]}});
      S.data.stickers=S.data.stickers.filter((_,i)=>!sel.includes(i));saveData();renderStickersPanel();
    });
  };
  el.querySelectorAll('.stk-del').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;const s=S.data.stickers[i];if(s&&s.key){idbDel(S.activeDreamId,s.key);delete S.dbImg[s.key]}
    S.data.stickers.splice(i,1);saveData();renderStickersPanel();
  });
}

/* ================= 主动行为定时器 ================= */
function setupProactive(){
  clearTimeout(S.activeProactiveTimer);S.activeProactiveTimer=null;
  if(!S.data||!S.data.settings.proactive)return;
  scheduleProactive();
}
function scheduleProactive(){
  clearTimeout(S.activeProactiveTimer);
  if(!S.data||!S.data.settings.proactive)return;
  const min=Math.max(1,S.data.settings.proactiveMin),max=Math.max(min,S.data.settings.proactiveMax);
  const delay=randInt(min,max)*1000;
  S.activeProactiveTimer=setTimeout(()=>{
    if(S.data.settings.proactive){pushMsg({from:'dream',type:'text',text:dreamPickReply(),read:false})}
    scheduleProactive();
  },delay);
}
let callProTimer=null;
function setupCallProactive(){
  clearInterval(callProTimer);callProTimer=null;
  if(!S.data||!S.data.settings.callProactive)return;
  callProTimer=setInterval(()=>{
    if(S.currentPage!=='chat')return;
    if(CALL.state)return;
    if(Math.random()<0.10)startIncomingCall();
  },60000);
}

  if(!S.data)return;
  S.currentPage='lib';
  document.getElementById('homePage').classList.add('hidden');
  document.getElementById('chatPage').classList.add('hidden');
  document.getElementById('libPage').classList.remove('hidden');
  document.getElementById('navBack').classList.remove('hidden');
  document.getElementById('navTitle').textContent='字卡庫';
  document.querySelectorAll('.lib-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.lib-panel').forEach(p=>p.classList.add('hidden'));
  const map={cards:'libPanelCards',kaomoji:'libPanelKaomoji',stickers:'libPanelStickers',settings:'libPanelSettings'};
  document.getElementById(map[tab]).classList.remove('hidden');
  S.currentLibTab=tab;renderLibAll();
}
function goChat(){
  if(!S.activeDreamId){showPage('home');return}
  S.currentPage='chat';
  document.getElementById('homePage').classList.add('hidden');
  document.getElementById('libPage').classList.add('hidden');
  document.getElementById('chatPage').classList.remove('hidden');
  document.getElementById('navBack').classList.remove('hidden');
  document.getElementById('navTitle').textContent=S.data?('與 '+(S.data.dream.name||'夢角')+' 聊天'):'聊天';
}

/* 表情包选择器 */
function openStickerPicker(){
  if(!S.data.stickers.length){toast('尚無表情包，請先到字卡庫新增');return}
  const {ov,close}=modal(`<h3>選擇表情包<button class="x">✕</button></h3><div id="stkGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>`);
  const grid=ov.querySelector('#stkGrid');
  S.data.stickers.forEach(s=>{
    const src=S.dbImg[s.key]||'';
    const b=document.createElement('button');
    b.style.cssText='padding:6px;border-radius:10px;background:var(--input-bg);display:flex;align-items:center;justify-content:center';
    b.innerHTML=`<img src="${src}" style="width:56px;height:56px;object-fit:contain">`;
    b.onclick=()=>{sendUserSticker(s);close()};
    grid.appendChild(b);
  });
}

/* ================= 事件绑定 ================= */
function bindEvents(){
  document.getElementById('navBack').onclick=()=>{
    if(S.currentPage==='lib')goChat();
    else if(S.currentPage==='chat')goHome();
  };
  document.getElementById('fabAdd').onclick=openNewDreamModal;
  document.getElementById('mailBtn').onclick=openWriteLetter;
  document.getElementById('inboxBtn').onclick=openInbox;

  document.getElementById('userHero').onclick=()=>openProfileEdit('user');
  document.getElementById('dreamHero').onclick=()=>openProfileEdit('dream');
  document.getElementById('btnTheme').onclick=openThemeModal;
  document.getElementById('btnLib').onclick=()=>goLib('cards');
  document.getElementById('btnData').onclick=openDataManager;
  document.getElementById('btnTarot').onclick=openTarot;
  document.getElementById('btnSurvey').onclick=openSurveyBuilder;

  document.getElementById('libBack').onclick=goChat;
  document.querySelectorAll('.lib-tab').forEach(b=>b.onclick=()=>goLib(b.dataset.tab));

  document.getElementById('sendBtn').onclick=sendUserText;
  const inp=document.getElementById('msgInput');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendUserText()}});
  inp.addEventListener('input',()=>{inp.style.height='38px';inp.style.height=Math.min(110,inp.scrollHeight)+'px';inp.style.lineHeight='1.4';inp.style.padding='9px 14px'});

  document.getElementById('btnContinue').onclick=triggerContinue;
  document.getElementById('btnImage').onclick=()=>{
    const f=document.getElementById('hiddenFile');f.accept='image/*';f.value='';f.onchange=()=>{
      const file=f.files[0];if(!file)return;
      const rd=new FileReader();rd.onload=()=>sendUserImage(rd.result);rd.readAsDataURL(file);
    };f.click();
  };
  document.getElementById('btnSticker').onclick=openStickerPicker;
  document.getElementById('btnCall').onclick=startOutgoingCall;
  document.getElementById('quoteClose').onclick=hideQuoteBar;

  document.addEventListener('click',e=>{if(!e.target.closest('#ctxMenu'))closeCtx()});
  // 定时检查信件回信（每分钟）
  setInterval(()=>{
    const n=unreadLettersCount();
    renderInboxBadge();
    if(n>0 && !document.getElementById('letterToast').classList.contains('show')){
      // 只在主页时提示
      if(S.currentPage==='home')showLetterToast();
    }
  },60000);
}

function openTarot(){

  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
  let step='choose', count=1, question='', drawn=[], flipped=0;
  function render(){
    if(step==='choose'){
      panel.innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">

              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-size:14px;font-weight:700;color:var(--tarot-text)">${TAROT_DECK[d.id].name}</span>
                <span style="font-size:10px;padding:2px 8px;border-radius:8px;background:${d.rev?'rgba(180,80,80,.18)':'rgba(120,160,90,.2)'};color:${d.rev?'#b45050':'#5a7a3a'}">${d.rev?'逆位':'正位'}</span>
              </div>
              <div style="font-size:11px;opacity:.5;margin:2px 0 6px">${TAROT_DECK[d.id].en}</div>
              <div style="font-size:12.5px;line-height:1.6;color:var(--tarot-text)">${d.rev?TAROT_DECK[d.id].reversed:TAROT_DECK[d.id].upright}</div>
            </div>
          </div>`).join('')}
        <div style="display:flex;gap:10px;margin-top:8px">
          <button id="tAgain" style="flex:1;padding:12px;border-radius:12px;background:var(--tarot-accent);color:#fff;font-size:14px;font-weight:600">再占一次</button>
          <button id="tClose2" style="flex:1;padding:12px;border-radius:12px;background:rgba(0,0,0,.08);color:var(--tarot-text);font-size:14px">關閉</button>
        </div>`;
      panel.querySelector('#tClose').onclick=()=>ov.remove();
      panel.querySelector('#tClose2').onclick=()=>ov.remove();
      panel.querySelector('#tAgain').onclick=()=>{step='choose';count=1;question='';drawn=[];flipped=0;render()};
    }
  }
  function drawCards(){
    const pool=[...TAROT_DECK];drawn=[];
    for(let i=0;i<count;i++){
      const idx=Math.floor(Math.random()*pool.length);
      const card=pool.splice(idx,1)[0];
      drawn.push({id:card.id,rev:Math.random()<0.5,flipped:false});
    }
  }
  render();
}

/* ================= 通話系統 ================= */
const CALL={state:null,timer:null,mini:null};
function ensureCallUI(){
  let c=document.getElementById('callOverlay');
  if(!c){
    c=document.createElement('div');
    c.id='callOverlay';
    c.style.cssText='position:fixed;inset:0;z-index:450;display:none;align-items:center;justify-content:center;background:var(--call-mask);padding:16px';
    document.body.appendChild(c);
  }
  return c;
}
function ensureMiniUI(){
  let m=document.getElementById('callMini');
  if(!m){
    m=document.createElement('div');
    m.id='callMini';
    m.style.cssText='position:fixed;z-index:460;display:none;background:var(--panel);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:10px 12px;width:210px;cursor:grab;user-select:none;transition:opacity .2s;touch-action:none';
    document.body.appendChild(m);
  }
  return m;
}
function callAvatarHTML(){return `<div style="width:72px;height:72px;border-radius:50%;overflow:hidden;border:2px solid var(--avatar-border);background:#eee;display:flex;align-items:center;justify-content:center;margin:0 auto">${avatarHTML(S.data?S.data.dream.avatarKey:null)}</div>`}
function fmtDur(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startOutgoingCall(){
  if(!S.data)return;
  if(CALL.state){toast('通話中');return}
  const ov=ensureCallUI();
  CALL.state={dir:'out',status:'calling',start:0};
  ov.style.display='flex';
  ov.innerHTML=`
    <div style="width:100%;max-width:340px;background:var(--panel);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">
      ${callAvatarHTML()}
      <div style="font-size:18px;font-weight:700;margin:14px 0 4px;color:var(--text)">${esc(S.data.dream.name||'夢角')}</div>
      <div id="callStatus" style="font-size:13px;color:var(--text-sub);margin-bottom:20px">正在呼叫...</div>
      <div id="callTimer" style="font-size:15px;color:var(--text-sub);margin-bottom:20px;font-variant-numeric:tabular-nums"></div>
      <div style="display:flex;gap:12px;justify-content:center"><button id="callHang" style="width:56px;height:56px;border-radius:50%;background:#e05a5a;color:#fff;font-size:22px">✕</button></div>
    </div>`;
  ov.querySelector('#callHang').onclick=()=>endCall('hang');
  setTimeout(()=>{if(CALL.state&&CALL.state.status==='calling'){if(Math.random()<0.5)connectCall();else endCall('reject')}},randInt(3000,6000));
}
function startIncomingCall(){
  if(!S.data)return;
  if(CALL.state)return;
  const ov=ensureCallUI();
  CALL.state={dir:'in',status:'ringing',start:0};
  ov.style.display='flex';
  ov.innerHTML=`
    <div style="width:100%;max-width:340px;background:var(--panel);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">
      ${callAvatarHTML()}
      <div style="font-size:18px;font-weight:700;margin:14px 0 4px;color:var(--text)">${esc(S.data.dream.name||'夢角')}</div>
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:20px">邀請你通話...</div>
      <div style="display:flex;gap:16px;justify-content:center">
        <button id="callReject" style="width:56px;height:56px;border-radius:50%;background:#e05a5a;color:#fff;font-size:20px">✕</button>
        <button id="callAccept" style="width:56px;height:56px;border-radius:50%;background:#37c26a;color:#fff;font-size:20px">✓</button>
      </div>
    </div>`;
  ov.querySelector('#callAccept').onclick=()=>connectCall();
  ov.querySelector('#callReject').onclick=()=>endCall('reject');
  CALL.state.autoTimer=setTimeout(()=>{if(CALL.state&&CALL.state.status==='ringing')endCall('miss')},15000);
}
function connectCall(){
  if(!CALL.state)return;
  CALL.state.status='connected';CALL.state.start=Date.now();
  const ov=document.getElementById('callOverlay');
  if(ov){
    ov.innerHTML=`
      <div style="width:100%;max-width:340px;background:var(--panel);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">
        ${callAvatarHTML()}
        <div style="font-size:18px;font-weight:700;margin:14px 0 4px;color:var(--text)">${esc(S.data.dream.name||'夢角')}</div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:6px">通話中</div>
        <div id="callTimer" style="font-size:20px;color:var(--text);margin-bottom:20px;font-variant-numeric:tabular-nums">00:00</div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button id="callMute" style="width:52px;height:52px;border-radius:50%;background:var(--input-bg);color:var(--text);font-size:18px">🎤</button>
          <button id="callMin" style="width:52px;height:52px;border-radius:50%;background:var(--input-bg);color:var(--text);font-size:18px">－</button>
          <button id="callHang" style="width:52px;height:52px;border-radius:50%;background:#e05a5a;color:#fff;font-size:20px">✕</button>
        </div>
      </div>`;
    ov.querySelector('#callHang').onclick=()=>endCall('hang');
    ov.querySelector('#callMin').onclick=()=>minimizeCall();
    let muted=false;
    ov.querySelector('#callMute').onclick=()=>{muted=!muted;ov.querySelector('#callMute').style.background=muted?'#e05a5a':'var(--input-bg)';ov.querySelector('#callMute').style.color=muted?'#fff':'var(--text)'};
  }
  clearInterval(CALL.timer);
  CALL.timer=setInterval(()=>{
    const el=document.getElementById('callTimer');
    if(el&&CALL.state&&CALL.state.status==='connected')el.textContent=fmtDur(Date.now()-CALL.state.start);
    const mel=document.getElementById('callMiniTimer');
    if(mel&&CALL.state&&CALL.state.status==='connected')mel.textContent=fmtDur(Date.now()-CALL.state.start);
  },1000);
}
function minimizeCall(){
  const ov=document.getElementById('callOverlay');if(ov)ov.style.display='none';
  const m=ensureMiniUI();
  m.style.display='block';m.style.left=(window.innerWidth-230)+'px';m.style.top=(window.innerHeight-130)+'px';
  m.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid var(--avatar-border)">${avatarHTML(S.data?S.data.dream.avatarKey:null)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.data?S.data.dream.name||'夢角':'夢角')}</div>
        <div style="font-size:11px;color:var(--text-sub)">通話中 · <span id="callMiniTimer">00:00</span></div>
      </div>
      <button id="miniHang" style="width:28px;height:28px;border-radius:50%;background:#e05a5a;color:#fff;font-size:12px">✕</button>
      <button id="miniExpand" style="width:28px;height:28px;border-radius:50%;background:var(--input-bg);color:var(--text);font-size:12px">⤢</button>
    </div>`;
  m.querySelector('#miniHang').onclick=()=>endCall('hang');
  m.querySelector('#miniExpand').onclick=()=>expandCall();
  makeDraggable(m);
}
function expandCall(){
  const m=document.getElementById('callMini');if(m)m.style.display='none';
  const ov=document.getElementById('callOverlay');if(ov)ov.style.display='flex';
}
function makeDraggable(el){
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  el.onmousedown=e=>{
    if(e.target.tagName==='BUTTON')return;
    dragging=true;sx=e.clientX;sy=e.clientY;
    ox=parseInt(el.style.left)||0;oy=parseInt(el.style.top)||0;
    el.style.cursor='grabbing';
  };
  const onMove=e=>{
    if(!dragging)return;
    let nx=ox+(e.clientX-sx),ny=oy+(e.clientY-sy);
    nx=Math.max(0,Math.min(window.innerWidth-el.offsetWidth,nx));
    ny=Math.max(0,Math.min(window.innerHeight-el.offsetHeight,ny));
    el.style.left=nx+'px';el.style.top=ny+'px';
  };
  const onUp=()=>{if(!dragging)return;dragging=false;el.style.cursor='grab'};
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  el.addEventListener('touchstart',e=>{
    if(e.target.tagName==='BUTTON')return;
    const t=e.touches[0];dragging=true;sx=t.clientX;sy=t.clientY;
    ox=parseInt(el.style.left)||0;oy=parseInt(el.style.top)||0;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const t=e.touches[0];
    let nx=ox+(t.clientX-sx),ny=oy+(t.clientY-sy);
    nx=Math.max(0,Math.min(window.innerWidth-el.offsetWidth,nx));
    ny=Math.max(0,Math.min(window.innerHeight-el.offsetHeight,ny));
    el.style.left=nx+'px';el.style.top=ny+'px';
    e.preventDefault();
  },{passive:false});
  el.addEventListener('touchend',()=>{dragging=false});
}
function endCall(reason){
  if(!CALL.state)return;
  const st=CALL.state;
  clearInterval(CALL.timer);clearTimeout(st.autoTimer);
  const ov=document.getElementById('callOverlay');if(ov)ov.style.display='none';
  const m=document.getElementById('callMini');if(m)m.style.display='none';
  const dur=st.start?Date.now()-st.start:0;
  let text='';
  if(reason==='reject')text='對方已拒絕你的通話';
  else if(reason==='miss')text='未接來電';
  else if(reason==='hang')text=st.start?`通話結束 · ${fmtDur(dur)}`:'通話已取消';
  else text='通話結束';
  if(S.data){S.data.messages.push({from:'user',type:'sys',text,ts:now(),id:uid()});saveData();renderMessages()}
  CALL.state=null;
}

/* ================= 启动 ================= */
(async function init(){
  await openDB();
  loadDreams();
  bindEvents();
  document.getElementById('acctName').textContent='訪客';
  showPage('home');
  renderHome();
  // 打开时检查信件回信（8-12h 到期的回信，会在打开时生成并提示）
  setTimeout(showLetterToast,500);
})();
</script>
